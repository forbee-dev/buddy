name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA (the comment names the tag), so a moved tag cannot change what runs.

jobs:
  swift:
    # Package.swift uses swift-tools-version 6.0 and macOS 14, with no newer SDK APIs
    # (no #available checks). Xcode 16 or later is enough. macos-latest always ships a
    # newer Xcode, so it stays current. If a runner Xcode is ever too old, `swift build`
    # fails at once on the tools version; then pin one with maxim-lobanov/setup-xcode.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "hash=$( (xcodebuild -version; swift --version) | shasum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - run: swift build
      - run: swift test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-ext
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node design/check-sprites.js
      - run: node design/sounds/gen-sounds.js --check
      - run: node design/check-skin.js

  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/remote/test_hook.py
